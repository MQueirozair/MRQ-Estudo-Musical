name: Instaladores (Windows, macOS e Linux)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ['arena/**', main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # 1) Instalar SEM baixar o binário do Electron (evita falha de rede no postinstall)
      - name: Instalar dependências
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Verificar instalação do Electron
        run: npm run electron:check

      # `|| true` mantém o job vivo para que o erro real apareça no resumo
      - name: Gerar instaladores
        shell: bash
        run: |
          set -o pipefail
          npm run dist:${{ matrix.platform }} 2>&1 | tee build.log || echo "FALHOU=1" >> "$GITHUB_ENV"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/eb-cache

      - name: Diagnóstico (se falhou)
        if: env.FALHOU == '1'
        shell: bash
        run: |
          echo "::error title=electron-builder falhou::Veja as últimas linhas do log"
          echo "### Últimas linhas do build" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -viE "^\s*$" build.log | tail -40 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -iE "error|cannot|failed|not found|ENOENT|EACCES|ERR_" build.log | tail -20

      - name: Listar artefatos gerados
        shell: bash
        run: ls -la release/ || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instaladores-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: warn

name: Instaladores (Windows, macOS e Linux)

on:
  workflow_dispatch:
  # roda também em PRs, para gerar os instaladores antes do merge
  pull_request:
  push:
    branches: ['arena/**', main]
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      # Diagnóstico curto e legível se algo falhar no empacotamento
      - name: Versões
        run: |
          node -v
          npm -v
          npx electron --version

      - name: Gerar instaladores
        run: npx vite build && npx electron-builder --${{ matrix.platform }} --publish never
        env:
          # Builds não assinados (sem certificado comercial)
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/eb-cache
          DEBUG: electron-builder

      - name: Listar artefatos gerados
        shell: bash
        run: ls -la release/ || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instaladores-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.yml
          if-no-files-found: warn

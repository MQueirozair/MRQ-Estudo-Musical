name: Instaladores (Windows, macOS e Linux)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ['arena/**', main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # 1) Instalar SEM baixar o binário do Electron (evita falha de rede no postinstall)
      - name: Instalar dependências
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Verificar instalação do Electron
        run: npm run electron:check

      - name: Gerar instaladores
        run: npm run dist:${{ matrix.platform }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_BUILDER_CACHE: ${{ runner.temp }}/eb-cache

      - name: Listar artefatos gerados
        shell: bash
        run: ls -la release/ || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instaladores-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: warn

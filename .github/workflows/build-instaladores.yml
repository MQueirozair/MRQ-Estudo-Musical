name: Instaladores (Windows, macOS e Linux)

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ['arena/**', main]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Instala sem baixar o binário do Electron (evita falha de rede no postinstall);
      # o download acontece no passo seguinte, com mensagens de erro claras.
      - name: Instalar dependências
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Verificar instalação do Electron
        run: npm run electron:check

      - name: Gerar instaladores
        shell: bash
        run: |
          set -o pipefail
          npm run dist:${{ matrix.platform }} 2>&1 | tee build.log || true

      - name: Conferir e publicar artefatos
        shell: bash
        run: |
          echo "### Arquivos gerados" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          ls -lh release/ 2>/dev/null | awk '{print $5, $9}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

          qtd=$(ls release/*.exe release/*.dmg release/*.zip release/*.AppImage release/*.deb 2>/dev/null | wc -l)
          if [ "$qtd" -eq 0 ]; then
            echo "::error title=Sem instalador::o empacotamento não gerou arquivos. Últimas linhas:"
            echo "### Falha no empacotamento" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -viE "^\s*$" build.log | tail -40 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "$qtd instalador(es) gerado(s)."

      # Diagnóstico: publica o log do build no próprio branch (somente em execução manual)
      - name: Publicar log de diagnóstico
        if: github.event_name == 'workflow_dispatch' && always()
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p .diag
          cp build.log ".diag/build-${{ matrix.platform }}.log" 2>/dev/null || echo "sem build.log" > ".diag/build-${{ matrix.platform }}.log"
          git config user.name "arena-agent"
          git config user.email "agent@arena.ai"
          git add -f .diag
          git commit -m "ci(diag): log do build ${{ matrix.platform }}" || true
          git pull --rebase --autostash origin "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" || true
          git push origin "HEAD:${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" || true

      # Só os instaladores (o *-unpacked/*.blockmap ficam de fora)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instaladores-${{ matrix.platform }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
          if-no-files-found: warn

  # Junta os instaladores num Release do GitHub (download direto, sem login),
  # rodando só quando a execução foi disparada manualmente ou por tag.
  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: instaladores-*
          merge-multiple: true

      - name: Conferir arquivos antes de publicar
        run: |
          find dist -type f | sort
          du -sh dist

      - uses: softprops/action-gh-release@v2
        with:
          name: MRQ Estudo Musical ${{ github.ref_name }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          draft: false
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          body: |
            ## MRQ Estudo Musical

            Instaladores do aplicativo desktop (base local, 100% offline).

            | Sistema | Arquivo |
            | --- | --- |
            | Windows x64 | `.exe` (instalador) — também há versão portátil |
            | macOS Intel + Apple Silicon | `.dmg` e `.zip` |
            | Linux | `.AppImage` e `.deb` |

            Builds não assinados com certificado comercial:
            - **Windows:** se o SmartScreen avisar, clique em *Mais informações → Executar assim mesmo*.
            - **macOS:** clique com o botão direito no app → *Abrir*.

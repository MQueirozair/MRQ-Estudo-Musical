name: CI — Build & Testes MRQ Estudo Musical

on:
  push:
    branches: [ main, development, "arena/**" ]
  pull_request:
    branches: [ main, development ]

jobs:
  build-and-test:
    name: C++17 DSP + IA + API + Frontend (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build & Test Native C++17 DSP Core
        run: make -C core test

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Full Automated Test Suite (DSP, Formats, AI, SQLite, API, Performance)
        run: python -m pytest -v tests/

      - name: Build Frontend Studio (TypeScript + Vite)
        run: |
          npm --prefix apps/studio ci
          npm --prefix apps/studio run build
